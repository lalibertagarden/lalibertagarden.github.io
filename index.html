<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>La Liberta Garden — Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130f;
    --bg-2: #1f1a14;
    --panel: #241d17;
    --line: #4a3a2a;
    --line-soft: #382c22;
    --cream: #ece1c9;
    --cream-dim: #b3a488;
    --gold: #cf9a43;
    --gold-bright: #e6b45c;
    --ivy: #6b8354;
    --ivy-dark: #3f5230;
    --shadow: rgba(0,0,0,0.5);
    --display: 'Rye', serif;
    --serif: 'Cormorant Garamond', serif;
    --sans: 'Jost', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(207,154,67,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color:var(--cream);
    font-family:var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  /* subtle brick/plaster texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.02) 0, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.015) 0, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.15) 0, transparent 3px);
    background-size: 90px 90px, 130px 130px, 70px 70px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{max-width:640px; margin:0 auto; position:relative; z-index:1; padding-bottom:80px;}

  /* ---------- HERO ---------- */
  .hero{
    text-align:center;
    padding:38px 20px 26px;
    position:relative;
  }
  .bulb-wrap{
    display:flex; flex-direction:column; align-items:center;
    margin-bottom:6px;
  }
  .bulb-cord{ width:2px; height:22px; background:linear-gradient(var(--line), transparent);}
  .bulb{
    width:34px; height:40px;
    position:relative;
    margin-bottom:4px;
  }
  .bulb svg{ width:100%; height:100%; filter: drop-shadow(0 0 14px rgba(230,180,92,0.55)); animation: flicker 5s infinite ease-in-out;}
  @keyframes flicker{
    0%,100%{ opacity:1; filter: drop-shadow(0 0 14px rgba(230,180,92,0.55)); }
    92%{ opacity:1; }
    93%{ opacity:0.75; filter: drop-shadow(0 0 6px rgba(230,180,92,0.3)); }
    95%{ opacity:1; filter: drop-shadow(0 0 14px rgba(230,180,92,0.55)); }
  }

  .logo-img{
    width:172px; height:172px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--line);
    box-shadow: 0 0 0 6px var(--bg-2), 0 10px 30px var(--shadow), 0 0 40px rgba(207,154,67,0.12);
    margin-top:6px;
  }

  .tagline{
    font-family:var(--sans);
    letter-spacing:0.32em;
    text-transform:uppercase;
    font-size:12.5px;
    color:var(--gold);
    margin-top:18px;
  }
  .subtitle{
    font-family:var(--serif);
    font-style:italic;
    color:var(--cream-dim);
    font-size:15px;
    margin-top:6px;
  }

  /* ---------- LANG TOGGLE ---------- */
  .lang-toggle{
    position:fixed; top:16px; right:16px; z-index:50;
    display:flex; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:3px; box-shadow:0 6px 20px var(--shadow);
  }
  .lang-toggle button{
    font-family:var(--sans); font-size:12px; letter-spacing:0.05em;
    padding:6px 13px; border-radius:999px; border:none; background:transparent;
    color:var(--cream-dim); cursor:pointer; transition:.25s;
  }
  .lang-toggle button.active{ background:var(--gold); color:#1a140d; font-weight:600;}

  /* ---------- CATEGORY NAV ---------- */
  .catnav{
    position:sticky; top:0; z-index:40;
    display:flex; gap:8px; overflow-x:auto;
    padding:12px 16px; margin:10px 0 6px;
    background:linear-gradient(180deg, var(--bg) 60%, rgba(23,19,15,0.85));
    backdrop-filter:blur(6px);
    -ms-overflow-style:none; scrollbar-width:none;
    border-bottom:1px solid var(--line-soft);
  }
  .catnav::-webkit-scrollbar{display:none;}
  .catnav a{
    flex:0 0 auto;
    font-family:var(--sans); font-size:13.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--cream-dim); text-decoration:none;
    padding:7px 14px; border:1px solid var(--line); border-radius:999px;
    white-space:nowrap; transition:.25s;
  }
  .catnav a:hover, .catnav a.active{ color:#1a140d; background:var(--gold); border-color:var(--gold);}

  /* ---------- DIVIDER ---------- */
  .ivy-divider{ display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0 18px; opacity:0.8;}
  .ivy-divider svg{ width:110px; height:14px;}
  .ivy-divider .diamond{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); flex:0 0 auto;}

  /* ---------- SECTIONS ---------- */
  section.category{ padding:22px 20px 6px; scroll-margin-top:70px; position:relative; overflow:hidden;}
  .cat-bg-icon{
    position:absolute; top:-10px; right:-18px; width:170px; height:170px;
    opacity:0.09; pointer-events:none; z-index:0; transform:rotate(-4deg);
  }
  .cat-bg-icon svg{ width:100%; height:100%; display:block; stroke:var(--cream); fill:none;}
  section.category > .cat-head, section.category > .ivy-divider, section.category > .item,
  section.category > .add-item-btn{ position:relative; z-index:1;}
  .cat-head{ text-align:center; margin-bottom:4px;}
  .cat-head h2{
    font-family:var(--display); font-weight:400;
    font-size:34px; letter-spacing:0.03em;
    color:var(--cream);
    text-shadow:0 2px 10px rgba(0,0,0,0.4);
  }
  .cat-head p{ font-family:var(--sans); font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--gold); margin-top:2px;}

  .item{
    display:flex; align-items:baseline; gap:8px;
    padding:13px 2px;
    border-bottom:1px dashed var(--line-soft);
  }
  .item:last-child{ border-bottom:none;}
  .item-name{ font-size:21.5px; font-weight:600; color:var(--cream); line-height:1.25;}
  .item-desc{ font-family:var(--sans); font-size:14px; color:var(--cream-dim); margin-top:3px; line-height:1.5; font-style:normal;}
  .item-lead{ flex:1; border-bottom:1px dotted var(--line); transform:translateY(-6px); min-width:14px;}
  .item-heading{
    font-family:var(--sans); font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gold); margin:16px 0 4px; padding-top:8px; border-top:1px solid var(--line-soft);
  }
  .item-heading:first-child{ border-top:none; margin-top:2px; padding-top:0;}
  .cat-note{
    font-family:var(--sans); font-size:11.5px; font-style:italic; color:var(--cream-dim);
    text-align:center; margin-top:10px; opacity:0.75;
  }
  .item-price{ font-family:var(--sans); font-size:18px; color:var(--gold-bright); font-weight:600; white-space:nowrap;}
  .item-main{ flex:1; min-width:0;}
  .item-row-top{ display:flex; align-items:baseline; gap:8px;}

  .tag{
    display:inline-block; font-family:var(--sans); font-size:9.5px; letter-spacing:0.04em;
    color:var(--ivy); border:1px solid var(--ivy-dark); border-radius:5px;
    padding:1px 5px; margin-left:6px; vertical-align:middle; text-transform:uppercase;
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center; padding:40px 20px 20px; color:var(--cream-dim);
    font-family:var(--sans); font-size:12px; letter-spacing:0.04em;
  }
  footer .fname{ font-family:var(--display); font-size:22px; color:var(--gold); letter-spacing:0.02em; margin-bottom:8px;}
  footer .addr{ margin-top:6px; opacity:0.8;}

  /* ---------- EDIT MODE ---------- */
  .gear-btn{
    position:fixed; bottom:18px; right:18px; z-index:60;
    width:46px; height:46px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 8px 24px var(--shadow);
    color:var(--gold-bright); font-size:18px;
    opacity:0.55; transition:.25s;
  }
  .gear-btn:hover{ opacity:1; transform:rotate(20deg);}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,8,6,0.72);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-backdrop.show{ display:flex;}
  .modal{
    background:var(--bg-2); border:1px solid var(--line); border-radius:14px;
    max-width:420px; width:100%; padding:24px; box-shadow:0 20px 60px var(--shadow);
  }
  .modal h3{ font-family:var(--display); font-size:22px; color:var(--gold); margin-bottom:14px; font-weight:400;}
  .modal input[type=password], .modal input[type=text]{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--cream); font-family:var(--sans); font-size:14px; margin-bottom:12px;
  }
  .modal-btns{ display:flex; gap:10px; justify-content:flex-end;}
  .btn{
    font-family:var(--sans); font-size:13px; padding:9px 16px; border-radius:8px; border:1px solid var(--line);
    background:transparent; color:var(--cream-dim); cursor:pointer;
  }
  .btn.primary{ background:var(--gold); color:#1a140d; border-color:var(--gold); font-weight:600;}
  .btn.danger{ color:#d97757; border-color:#5a3a2c;}

  /* edit mode active state */
  body.editing .item-name, body.editing .item-desc, body.editing .item-price, body.editing .cat-head h2{
    outline:1px dashed rgba(207,154,67,0.5); outline-offset:3px; cursor:text; border-radius:3px;
  }
  body.editing .item-name:focus, body.editing .item-desc:focus, body.editing .item-price:focus, body.editing .cat-head h2:focus{
    outline:1px solid var(--gold-bright); background:rgba(207,154,67,0.06);
  }
  .edit-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:70;
    background:var(--panel); border-top:1px solid var(--line);
    padding:12px 16px; display:none; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 -8px 24px var(--shadow);
  }
  body.editing .edit-bar{ display:flex;}
  .item-del{
    display:none; font-family:var(--sans); font-size:11px; color:#d97757; cursor:pointer; margin-left:8px; white-space:nowrap;
  }
  body.editing .item-del{ display:inline-block;}
  .add-item-btn, .add-cat-btn{
    display:none; font-family:var(--sans); font-size:12px; color:var(--ivy); border:1px dashed var(--ivy-dark);
    border-radius:8px; padding:8px; text-align:center; cursor:pointer; margin-top:8px;
  }
  body.editing .add-item-btn, body.editing .add-cat-btn{ display:block;}

  .loading-note{ text-align:center; font-family:var(--sans); font-size:11px; color:var(--cream-dim); padding:6px; opacity:0.6;}

  .theme-panel{
    margin:16px 20px 8px; padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--panel);
  }
  .theme-panel-title{
    font-family:var(--sans); font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:12px;
  }
  .theme-row{ display:flex; gap:16px; flex-wrap:wrap;}
  .theme-field{ display:flex; flex-direction:column; align-items:center; gap:6px;}
  .theme-field label{ font-family:var(--sans); font-size:11px; color:var(--cream-dim); text-align:center;}
  .theme-field input[type=color]{
    width:44px; height:44px; border:1px solid var(--line); border-radius:8px; background:none; cursor:pointer; padding:0;
  }
  .theme-reset{
    display:inline-block; margin-top:14px; font-family:var(--sans); font-size:11.5px; color:var(--cream-dim);
    border:1px dashed var(--line); border-radius:8px; padding:7px 12px; cursor:pointer;
  }
  .theme-reset:hover{ color:var(--gold-bright); border-color:var(--gold);}

  .github-panel{ margin-top:14px;}
  .github-note{ font-family:var(--sans); font-size:11px; color:var(--cream-dim); line-height:1.5; margin-bottom:12px; opacity:0.85;}
  .github-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .github-field{ display:flex; flex-direction:column; gap:4px;}
  .github-field label{ font-family:var(--sans); font-size:10.5px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:0.06em;}
  .github-field input{
    width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg); color:var(--cream); font-family:var(--sans); font-size:12.5px;
  }
  .github-status{ font-family:var(--sans); font-size:11.5px; color:var(--gold-bright); margin-top:10px; min-height:14px;}
  @media (max-width:480px){
    .github-grid{ grid-template-columns:1fr;}
  }

  @media (max-width:420px){
    .logo-img{ width:140px; height:140px;}
    .cat-head h2{ font-size:29px;}
    .item-name{ font-size:19px;}
    .cat-bg-icon{ width:120px; height:120px;}
  }
</style>
</head>

  <button id="btn-en">EN</button>
</div>

    <div class="bulb-wrap">
      <div class="bulb-cord"></div>

          <ellipse cx="12" cy="11" rx="9" ry="10" fill="#e6b45c" opacity="0.9"/>

  // ---- color helpers ----
  function hexToRgb(hex){
    hex = hex.replace("#","");
    if (hex.length === 3) hex = hex.split("").map(function(c){return c+c;}).join("");
    var n = parseInt(hex, 16);
    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
  }
  function rgbToHex(r,g,b){
    function h(v){ v = Math.max(0,Math.min(255,Math.round(v))); var s = v.toString(16); return s.length===1?"0"+s:s; }
    return "#" + h(r) + h(g) + h(b);
  }
  function mix(hex1, hex2, w){
    var a = hexToRgb(hex1), b = hexToRgb(hex2);
    return rgbToHex(a.r+(b.r-a.r)*w, a.g+(b.g-a.g)*w, a.b+(b.b-a.b)*w);
  }
  function lighten(hex, amt){ return mix(hex, "#ffffff", amt); }
  function darken(hex, amt){ return mix(hex, "#000000", amt); }

  function deriveTheme(base){
    return {
      bg: base.bg,
      bg2: lighten(base.bg, 0.06),
      panel: lighten(base.bg, 0.09),
      line: lighten(base.bg, 0.22),
      lineSoft: lighten(base.bg, 0.15),
      cream: base.cream,
      creamDim: mix(base.cream, base.bg, 0.42),
      gold: base.gold,
      goldBright: lighten(base.gold, 0.14),
      ivy: base.ivy,
      ivyDark: darken(base.ivy, 0.3)
    };
  }

  function applyTheme(){
    var t = deriveTheme(state.theme);
    var r = document.documentElement.style;
    r.setProperty("--bg", t.bg);
    r.setProperty("--bg-2", t.bg2);
    r.setProperty("--panel", t.panel);
    r.setProperty("--line", t.line);
    r.setProperty("--line-soft", t.lineSoft);
    r.setProperty("--cream", t.cream);
    r.setProperty("--cream-dim", t.creamDim);
    r.setProperty("--gold", t.gold);
    r.setProperty("--gold-bright", t.goldBright);
    r.setProperty("--ivy", t.ivy);
    r.setProperty("--ivy-dark", t.ivyDark);
  }

  function loadTheme(cb){
    if (!window.storage) { state.theme = Object.assign({}, DEFAULT_THEME); if(cb) cb(); return; }
    window.storage.get(THEME_KEY, true).then(function(res){
      if (res && res.value){
        try { state.theme = Object.assign({}, DEFAULT_THEME, JSON.parse(res.value)); }
        catch(e){ state.theme = Object.assign({}, DEFAULT_THEME); }
      } else {
        state.theme = Object.assign({}, DEFAULT_THEME);
      }
      applyTheme();
      if (cb) cb();
    }).catch(function(){
      state.theme = Object.assign({}, DEFAULT_THEME);
      applyTheme();
      if (cb) cb();
    });
  }

  function saveTheme(cb){
    if (!window.storage) { if(cb) cb(false); return; }
    window.storage.set(THEME_KEY, JSON.stringify(state.theme), true).then(function(res){
      if (cb) cb(!!res);
    }).catch(function(){ if(cb) cb(false); });
  }

  // ---- GitHub publishing ----
  function loadGithubConfig(){
    try {
      var raw = localStorage.getItem(GITHUB_CONFIG_KEY);
      if (raw) return Object.assign({ owner:"", repo:"", path:"index.html", token:"" }, JSON.parse(raw));
    } catch(e){}
    return { owner:"", repo:"", path:"index.html", token:"" };
  }

  function saveGithubConfig(){
    try { localStorage.setItem(GITHUB_CONFIG_KEY, JSON.stringify(state.github)); } catch(e){}
  }

  function utf8ToBase64(str){
    var bytes = new TextEncoder().encode(str);
    var binary = "";
    var chunk = 0x8000;
    for (var i=0; i<bytes.length; i+=chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    }
    return btoa(binary);
  }

  function base64ToUtf8(b64){
    var binary = atob(b64.replace(/\n/g, ""));
    var bytes = new Uint8Array(binary.length);
    for (var i=0; i<binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
    return new TextDecoder().decode(bytes);
  }

  function publishToGitHub(){
    var cfg = state.github;
    if (!cfg.owner || !cfg.repo || !cfg.token){
      return Promise.resolve({ ok:false, message:"GitHub ayarları eksik" });
    }
    var path = cfg.path || "index.html";
    var api = "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + path + "?ref=main";
    var headers = {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json"
    };
    return fetch(api, { headers: headers }).then(function(getRes){
      if (!getRes.ok){
        return getRes.json().catch(function(){return {};}).then(function(errData){
          throw new Error("Dosya okunamadı (" + getRes.status + ") " + (errData.message||""));
        });
      }
      return getRes.json();
    }).then(function(getData){
      var currentText = base64ToUtf8(getData.content);

      var menuJson = "window.DEFAULT_MENU = " + JSON.stringify(state.data, null, 2) + ";";
      var newText = currentText.replace(/window\.DEFAULT_MENU = \{[\s\S]*?\n\};/, function(){ return menuJson; });

      var themeJson = "var DEFAULT_THEME = " + JSON.stringify(state.theme) + ";";
      newText = newText.replace(/var DEFAULT_THEME = \{[^}]*\};/, function(){ return themeJson; });

      if (newText === currentText){
        throw new Error("İçerik dosyada bulunamadı, yapı değişmiş olabilir");
      }

      return fetch(api.split("?")[0], {
        method: "PUT",
        headers: Object.assign({ "Content-Type": "application/json" }, headers),
        body: JSON.stringify({
          message: "Menü güncellendi - " + new Date().toLocaleString("tr-TR"),
          content: utf8ToBase64(newText),
          sha: getData.sha,
          branch: "main"
        })
      }).then(function(putRes){
        if (!putRes.ok){
          return putRes.json().catch(function(){return {};}).then(function(errData){
            throw new Error("Yayınlanamadı (" + putRes.status + ") " + (errData.message||""));
          });
        }
        return { ok:true, message:"GitHub'a başarıyla yayınlandı" };
      });
    }).catch(function(err){
      return { ok:false, message: err.message || "Bağlantı hatası" };
    });
  }

      + '<path d="M34 30 Q46 34 58 30" opacity="0.6"/>'
      + '<rect x="33" y="52" width="26" height="24" rx="2" opacity="0.55"/>'

    rocks: '<svg viewBox="0 0 100 100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'

    shot: '<svg viewBox="0 0 100 100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'

    chicken: '<svg viewBox="0 0 100 100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'

      + '<path d="M48 0 C15 -30 -42 -24 -44 0 C-42 24 15 30 48 0 Z"/>'
      + '<path d="M-28 12 Q-8 26 12 10" opacity="0.45"/>'
      + '<path d="M40 0 L66 0" stroke-width="10" fill="none"/>'
      + '<ellipse cx="70" cy="0" rx="9" ry="7" fill="none"/>'
      + '</g>'
      + '</svg>',
    meat: '<svg viewBox="0 0 100 100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M20 42 Q16 22 38 16 Q58 10 76 22 Q90 32 84 48 Q88 62 72 68 Q54 76 36 68 Q16 60 20 42 Z"/>'
      + '<path d="M30 28 L58 58" opacity="0.55"/>'
      + '<path d="M42 20 L72 50" opacity="0.55"/>'
      + '<path d="M54 16 L82 42" opacity="0.55"/>'
      + '<path d="M22 40 L46 64" opacity="0.55"/>'
      + '<circle cx="64" cy="80" r="7"/>'
      + '<circle cx="42" cy="84" r="6"/>'
      + '<circle cx="26" cy="76" r="5.5"/>'
      + '</svg>',
    pasta: '<svg viewBox="0 0 100 100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<ellipse cx="50" cy="64" rx="38" ry="16"/>'
      + '<ellipse cx="50" cy="61" rx="29" ry="11" opacity="0.4"/>'
      + '<path d="M30 58 C38 52 44 60 38 63 C34 65 33 60 37 60" opacity="0.9"/>'
      + '<path d="M40 66 C46 61 51 67 46 69" opacity="0.7"/>'
      + '<path d="M60 51 Q68 39 78 45 Q72 55 60 51 Z"/>'
      + '<path d="M56 43 Q62 31 72 35 Q66 45 56 43 Z"/>'
      + '<circle cx="66" cy="58" r="3.4" opacity="0.85"/>'
      + '</svg>',
    meze: '<svg viewBox="0 0 100 100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<ellipse cx="50" cy="62" rx="36" ry="15"/>'
      + '<ellipse cx="50" cy="59" rx="27" ry="10" opacity="0.5"/>'
      + '<circle cx="38" cy="58" r="3" fill="var(--cream)" opacity="0.8"/>'
      + '<circle cx="50" cy="55" r="3" fill="var(--cream)" opacity="0.8"/>'
      + '<circle cx="62" cy="58" r="3" fill="var(--cream)" opacity="0.8"/>'
      + '</svg>',
    nuts: '<svg viewBox="0 0 100 100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M18 46 Q18 82 50 82 Q82 82 82 46"/>'
      + '<path d="M18 46 H82"/>'
      + '<ellipse cx="34" cy="34" rx="7" ry="9" transform="rotate(-20 34 34)" opacity="0.8"/>'
      + '<ellipse cx="50" cy="28" rx="7" ry="9" opacity="0.8"/>'
      + '<ellipse cx="66" cy="34" rx="7" ry="9" transform="rotate(20 66 34)" opacity="0.8"/>'
      + '</svg>'
  };

  function getCategoryIcon(cat){
    if (cat.icon && CATEGORY_ICONS[cat.icon]) return CATEGORY_ICONS[cat.icon];
    var key = (cat.id + " " + (cat.name_tr||"") + " " + (cat.name_en||"")).toLowerCase();
    if (/kampanya|promo/.test(key)) return CATEGORY_ICONS.promo;
    if (/kokteyl|cocktail/.test(key)) return CATEGORY_ICONS.cocktail;
    if (/bira|beer/.test(key)) return CATEGORY_ICONS.beer;
    if (/kadeh|rocks|glass/.test(key)) return CATEGORY_ICONS.rocks;
    if (/şişe|sise|bottle|spirit/.test(key)) return CATEGORY_ICONS.spirit;
    if (/shot|şot/.test(key)) return CATEGORY_ICONS.shot;
    if (/şarap|sarap|wine/.test(key)) return CATEGORY_ICONS.wine;
    if (/alkols|non-alc|soft|meşrubat|mesrubat/.test(key)) return CATEGORY_ICONS.nonalcoholic;
    if (/tavuk|chicken/.test(key)) return CATEGORY_ICONS.chicken;
    if (/et yemek|meat|biftek|kavurma/.test(key)) return CATEGORY_ICONS.meat;
    if (/makarna|pasta|salata|salad/.test(key)) return CATEGORY_ICONS.pasta;
    if (/meze/.test(key)) return CATEGORY_ICONS.meze;
    if (/çerez|cerez|nuts|kuruyemiş/.test(key)) return CATEGORY_ICONS.nuts;
    if (/aperatif|atıştır|atistir|bite|snack/.test(key)) return CATEGORY_ICONS.fries;
    if (/yemek|food|burger|main/.test(key)) return CATEGORY_ICONS.food;
    return CATEGORY_ICONS.leaf;
  }

  function ivyDividerSVG(){
    return '<svg viewBox="0 0 110 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 7 H45" stroke="#4a3a2a" stroke-width="1"/><path d="M65 7 H110" stroke="#4a3a2a" stroke-width="1"/></svg>';
  }

  function renderThemePanel(){
    var panel = el("div", "theme-panel");
    var title = el("div", "theme-panel-title", "Görünüm");
    panel.appendChild(title);

    var row = el("div", "theme-row");

    function colorField(key, labelTr){
      var wrap = el("div", "theme-field");
      var lab = el("label", "", labelTr);
      var input = el("input");
      input.type = "color";
      input.value = state.theme[key];
      input.addEventListener("input", function(){
        state.theme[key] = input.value;
        applyTheme();
      });
      wrap.appendChild(lab);
      wrap.appendChild(input);
      return wrap;
    }

    row.appendChild(colorField("bg", "Arka Plan"));
    row.appendChild(colorField("cream", "Yazı Rengi"));
    row.appendChild(colorField("gold", "Vurgu (Altın)"));
    row.appendChild(colorField("ivy", "İkincil Vurgu (Yaprak)"));
    panel.appendChild(row);

    var resetBtn = el("div", "theme-reset", "Varsayılana Dön");
    resetBtn.addEventListener("click", function(){
      state.theme = Object.assign({}, DEFAULT_THEME);
      applyTheme();
      render();
    });
    panel.appendChild(resetBtn);

    return panel;
  }

  function renderGithubPanel(){
    var panel = el("div", "theme-panel github-panel");
    var title = el("div", "theme-panel-title", "GitHub Yayınlama");
    panel.appendChild(title);

    var note = el("div", "github-note", "Bu ayarlar sadece bu cihazda/tarayıcıda saklanır. \"Kaydet\" butonuna bastığında menü doğrudan GitHub reposuna yayınlanır.");
    panel.appendChild(note);

    function textField(key, labelTr, placeholder, isPassword){
      var wrap = el("div", "github-field");
      var lab = el("label", "", labelTr);
      var input = el("input");
      input.type = isPassword ? "password" : "text";
      input.placeholder = placeholder || "";
      input.value = state.github[key] || "";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.addEventListener("input", function(){
        state.github[key] = input.value.trim();
        saveGithubConfig();
      });
      wrap.appendChild(lab);
      wrap.appendChild(input);
      return wrap;
    }

    var grid = el("div", "github-grid");
    grid.appendChild(textField("owner", "Kullanıcı Adı", "örn. lalibertagarden"));
    grid.appendChild(textField("repo", "Repo Adı", "örn. lalibertagarden.github.io"));
    grid.appendChild(textField("path", "Dosya Yolu", "index.html"));
    grid.appendChild(textField("token", "GitHub Token", "ghp_... veya github_pat_...", true));
    panel.appendChild(grid);

    var status = el("div", "github-status", "");
    status.id = "githubStatus";
    panel.appendChild(status);

    return panel;
  }

  function renderContent(){
    els.content.innerHTML = "";
    if (state.editing){
      els.content.appendChild(renderThemePanel());
      els.content.appendChild(renderGithubPanel());
    }
    state.data.categories.forEach(function(cat, catIdx){
      var section = el("section", "category");
      section.id = "cat-" + cat.id;

      var bgIcon = el("div", "cat-bg-icon");
      bgIcon.innerHTML = getCategoryIcon(cat);
      section.appendChild(bgIcon);

      var head = el("div", "cat-head");
      if (state.editing){
        head.appendChild(editField(cat, "name_tr", "Kategori adı (TR)"));
        head.appendChild(editField(cat, "name_en", "Category name (EN)"));
        var delCat = el("div", "item-del", "✕ Kategoriyi sil");
        delCat.style.display = "block";
        delCat.style.marginTop = "6px";
        delCat.style.cursor = "pointer";
        delCat.addEventListener("click", function(){
          if (delCat.dataset.confirm === "1"){
            state.data.categories.splice(catIdx,1);
            render();
          } else {
            delCat.dataset.confirm = "1";
            delCat.textContent = "Emin misiniz? Tekrar tıklayın";
          }
        });
        head.appendChild(delCat);
      } else {
        var h2 = el("h2", "", state.lang === "tr" ? cat.name_tr : cat.name_en);
        head.appendChild(h2);
      }
      section.appendChild(head);

      var divider = el("div", "ivy-divider");
      divider.innerHTML = ivyDividerSVG() + '<span class="diamond"></span>' + ivyDividerSVG();
      section.appendChild(divider);

      cat.items.forEach(function(item, itemIdx){
        section.appendChild(renderItem(item, cat, catIdx, itemIdx));
      });

      if (!state.editing && (cat.note_tr || cat.note_en)){
        var note = state.lang === "tr" ? cat.note_tr : cat.note_en;
        if (note) section.appendChild(el("div", "cat-note", note));
      }
      if (state.editing){
        var noteRow = el("div"); noteRow.style.display="flex"; noteRow.style.gap="6px"; noteRow.style.flexWrap="wrap"; noteRow.style.marginTop="10px";
        noteRow.appendChild(editField(cat, "note_tr", "Kategori notu (TR, opsiyonel)"));
        noteRow.appendChild(editField(cat, "note_en", "Category note (EN, optional)"));
        section.appendChild(noteRow);

        var addHeadBtn = el("div", "add-item-btn", "+ Alt başlık ekle");
        addHeadBtn.style.display = "block";
        addHeadBtn.addEventListener("click", function(){
          cat.items.push({ isHeading:true, name_tr:"", name_en:"" });
          render();
        });
        section.appendChild(addHeadBtn);
      }

      if (state.editing){
        var addItemBtn = el("div", "add-item-btn", "+ Ürün ekle");
        addItemBtn.style.display = "block";
        addItemBtn.addEventListener("click", function(){
          cat.items.push({ name_tr:"", name_en:"", desc_tr:"", desc_en:"", price:"" });
          render();
        });
        section.appendChild(addItemBtn);
      }

      els.content.appendChild(section);
    });

    if (state.editing){
      var addCatWrap = el("div", "add-cat-btn", "+ Yeni kategori ekle");
      addCatWrap.style.display = "block";
      addCatWrap.style.margin = "20px 20px 0";
      addCatWrap.addEventListener("click", function(){
        var name = "Yeni Kategori";
        state.data.categories.push({ id: slugify(name) + "-" + Date.now(), name_tr:"", name_en:"", items: [] });
        render();
      });
      els.content.appendChild(addCatWrap);
    }
  }

  function editField(obj, key, placeholder){
    var input = el("input");
    input.type = "text";
    input.placeholder = placeholder;
    input.value = obj[key] || "";
    input.style.cssText = "width:100%;max-width:280px;background:var(--panel);border:1px solid var(--line);color:var(--cream);font-family:var(--sans);font-size:13px;padding:6px 8px;border-radius:6px;margin:3px 0;";
    input.addEventListener("input", function(){ obj[key] = input.value; });
    return input;
  }

  function renderItem(item, cat, catIdx, itemIdx){
    var wrap = el("div", item.isHeading ? "item-heading" : "item");

    if (state.editing){
      if (item.isHeading){
        var hcol = el("div", "item-main");
        var hrow = el("div"); hrow.style.display="flex"; hrow.style.gap="6px"; hrow.style.alignItems="center"; hrow.style.flexWrap="wrap";
        hrow.appendChild(editField(item, "name_tr", "Alt başlık (TR)"));
        hrow.appendChild(editField(item, "name_en", "Subheading (EN)"));
        var hdel = el("span", "item-del", "✕ Sil");
        hdel.style.display = "inline-block";
        hdel.addEventListener("click", function(){ cat.items.splice(itemIdx,1); render(); });
        hrow.appendChild(hdel);
        hcol.appendChild(hrow);
        wrap.appendChild(hcol);
        wrap.className = "item";
        return wrap;
      }
      var col = el("div", "item-main");
      var row1 = el("div"); row1.style.display="flex"; row1.style.gap="6px"; row1.style.flexWrap="wrap";
      row1.appendChild(editField(item, "name_tr", "Ürün adı (TR)"));
      row1.appendChild(editField(item, "name_en", "Product name (EN)"));
      col.appendChild(row1);

      var row2 = el("div"); row2.style.display="flex"; row2.style.gap="6px"; row2.style.flexWrap="wrap";
      row2.appendChild(editField(item, "desc_tr", "Açıklama (TR, opsiyonel)"));
      row2.appendChild(editField(item, "desc_en", "Description (EN, optional)"));
      col.appendChild(row2);

      var row3 = el("div"); row3.style.display="flex"; row3.style.gap="6px"; row3.style.alignItems="center"; row3.style.marginTop="2px";
      var priceInput = editField(item, "price", "Fiyat");
      priceInput.style.maxWidth = "90px";
      row3.appendChild(priceInput);
      var tagInput = editField(item, "tag_tr", "Etiket TR (ops. örn. İmza)");
      tagInput.style.maxWidth = "150px";
      row3.appendChild(tagInput);
      var tagInputEn = editField(item, "tag_en", "Tag EN (opt.)");
      tagInputEn.style.maxWidth = "150px";
      row3.appendChild(tagInputEn);

      var del = el("span", "item-del", "✕ Sil");
      del.style.display = "inline-block";
      del.addEventListener("click", function(){
        cat.items.splice(itemIdx, 1);
        render();
      });
      row3.appendChild(del);
      col.appendChild(row3);

      wrap.appendChild(col);
      return wrap;
    }

    // display mode
    if (item.isHeading){
      wrap.textContent = state.lang === "tr" ? item.name_tr : item.name_en;
      return wrap;
    }
    var main = el("div", "item-main");
    var top = el("div", "item-row-top");
    var name = state.lang === "tr" ? item.name_tr : item.name_en;
    var nameEl = el("span", "item-name", name || "");
    var tag = state.lang === "tr" ? item.tag_tr : item.tag_en;
    if (tag) {
      var tagEl = el("span", "tag", tag);
      nameEl.appendChild(tagEl);
    }
    top.appendChild(nameEl);
    var lead = el("span", "item-lead");
    top.appendChild(lead);
    var price = el("span", "item-price", item.price ? (item.price + " ₺") : "");
    top.appendChild(price);
    main.appendChild(top);

    var desc = state.lang === "tr" ? item.desc_tr : item.desc_en;
    if (desc) main.appendChild(el("div", "item-desc", desc));

    wrap.appendChild(main);
    return wrap;
  }

  // ---- events ----
  els.btnTr.addEventListener("click", function(){
    state.lang = "tr";
    document.documentElement.lang = "tr";
    els.btnTr.classList.add("active"); els.btnEn.classList.remove("active");
    render();
  });
  els.btnEn.addEventListener("click", function(){
    state.lang = "en";
    document.documentElement.lang = "en";
    els.btnEn.classList.add("active"); els.btnTr.classList.remove("active");
    render();
  });

  els.gearBtn.addEventListener("click", function(){
    if (state.editing) return;
    els.pwModal.classList.add("show");
    els.pwInput.value = "";
    els.pwInput.style.borderColor = "";
    setTimeout(function(){ els.pwInput.focus(); }, 50);
  });
  els.pwCancel.addEventListener("click", function(){
    els.pwModal.classList.remove("show");
  });
  els.pwOk.addEventListener("click", tryUnlock);
  els.pwInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlock(); });

  function tryUnlock(){
    if (els.pwInput.value === EDIT_PASSWORD){
      state.backup = { data: JSON.parse(JSON.stringify(state.data)), theme: JSON.parse(JSON.stringify(state.theme)) };
      state.editing = true;
      els.pwModal.classList.remove("show");
      render();
    } else {
      els.pwInput.style.borderColor = "#d97757";
      els.pwInput.value = "";
      els.pwInput.placeholder = "Yanlış şifre, tekrar deneyin";
    }
  }

  els.exitEditBtn.addEventListener("click", function(){
    state.editing = false;
    render();
  });

  els.cancelEditBtn.addEventListener("click", function(){
    if (els.cancelEditBtn.dataset.confirm === "1"){
      if (state.backup){
        state.data = JSON.parse(JSON.stringify(state.backup.data));
        state.theme = JSON.parse(JSON.stringify(state.backup.theme));
        applyTheme();
      }
      state.editing = false;
      els.cancelEditBtn.textContent = "İptal";
      delete els.cancelEditBtn.dataset.confirm;
      render();
    } else {
      els.cancelEditBtn.dataset.confirm = "1";
      els.cancelEditBtn.textContent = "Emin misiniz?";
      setTimeout(function(){
        if (els.cancelEditBtn.dataset.confirm === "1"){
          els.cancelEditBtn.textContent = "İptal";
          delete els.cancelEditBtn.dataset.confirm;
        }
      }, 3000);
    }
  });

  els.addCatBtn.addEventListener("click", function(){
    state.data.categories.push({ id: "cat-" + Date.now(), name_tr:"", name_en:"", items: [] });
    render();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  });

  els.saveBtn.addEventListener("click", function(){
    var original = els.saveBtn.textContent;
    els.saveBtn.textContent = "Kaydediliyor...";
    var statusEl = document.getElementById("githubStatus");
    saveMenu(function(ok){
      saveTheme(function(ok2){
        if (ok && ok2){
          state.backup = { data: JSON.parse(JSON.stringify(state.data)), theme: JSON.parse(JSON.stringify(state.theme)) };
        }
        var hasGithub = state.github && state.github.owner && state.github.repo && state.github.token;
        if (hasGithub){
          els.saveBtn.textContent = "GitHub'a yayınlanıyor...";
          publishToGitHub().then(function(res){
            els.saveBtn.textContent = res.ok ? "Yayınlandı ✓" : "Hata ✕";
            if (statusEl) statusEl.textContent = res.message;
            setTimeout(function(){ els.saveBtn.textContent = original; }, 2400);
          });
        } else {
          els.saveBtn.textContent = (ok && ok2) ? "Kaydedildi ✓" : "Hata, tekrar deneyin";
          if (statusEl) statusEl.textContent = "GitHub bilgileri girilmedi, sadece önizlemede kaydedildi.";
          setTimeout(function(){ els.saveBtn.textContent = original; }, 1800);
        }
      });
    });
  });

  state.github = loadGithubConfig();
  loadTheme(loadMenu);
})();

</script>
</body>
</html>
